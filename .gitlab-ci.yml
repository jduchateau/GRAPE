stages:
  - build
  - deploy

pages:
  stage: deploy
  needs: [ ]
  image: python:3-alpine
  before_script:
    - pip install poetry
    - poetry config virtualenvs.create false
    - poetry install
  script:
    - poetry run mkdocs build --verbose --strict
  artifacts:
    paths:
      - public
  rules:
    # This ensures that only pushes to the default branch
    # will trigger a pages deploy
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH

build-plugin:
  stage: build
  image: eclipse-temurin:21-jdk
  script:
    - ./gradlew zip
  artifacts:
    paths:
      - build/artifacts/GrapePlugin/GrapePlugin.zip
    expire_in: 1 week
  rules:
    # Trigger only on version tags following semantic versioning (e.g., v0.1.2)
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/

release:
  stage: deploy
  image: jreleaser/jreleaser-slim:1.25.0
  needs:
    - build-plugin
  variables:
    # Disable shallow cloning so that JReleaser can diff between tags
    # to generate a changelog
    GIT_DEPTH: 0
  script:
    - export JRELEASER_PROJECT_VERSION=${CI_COMMIT_TAG#v}
    - jreleaser release
  rules:
    # Trigger only on version tags following semantic versioning (e.g., v0.1.2)
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
