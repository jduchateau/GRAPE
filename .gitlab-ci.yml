stages:
  - prepare
  - build
  - deploy

pages:
  stage: deploy
  needs: [ ]
  image: python:3-alpine
  before_script:
    - pip install poetry
    - poetry config virtualenvs.create false
    - poetry install
  script:
    - poetry run mkdocs build --verbose --strict
  artifacts:
    paths:
      - public
  rules:
    # This ensures that only pushes to the default branch
    # will trigger a pages deploy
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH

prepare-carml:
  stage: prepare
  image: maven:3.9-eclipse-temurin-21
  cache:
    key: "carml-dependency-cache"
    paths:
      - .m2/repository
  script:
    - |
      if [ ! -d ".m2/repository/io/carml/jar/carml-app-jena/1.5.0-SNAPSHOT" ]; then
        echo "carml-app-jena not found in cache. Building from source..."
        git clone --branch rml-cg --depth 1 https://github.com/carml/carml-jar.git /tmp/carml-jar
        (cd /tmp/carml-jar && mvn clean install -DskipTests -Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository)
        rm -rf /tmp/carml-jar
      else
        echo "carml-app-jena found in cache, skipping build."
      fi
  artifacts:
    paths:
      - .m2/repository/io/carml
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # Trigger on version tags following semantic versioning (e.g., v0.1.2)
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/

build-plugin:
  stage: build
  image: eclipse-temurin:21-jdk
  needs:
    - prepare-carml
  cache:
    key: "grape-mps-platform-cache"
    paths:
      - build/mps-platform-cache
  before_script:
    - mkdir -p /root/.m2
    - ln -sfn $CI_PROJECT_DIR/.m2/repository /root/.m2/repository
  script:
    - ./gradlew zip
  artifacts:
    paths:
      - build/artifacts/GrapePlugin/GrapePlugin.zip
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # Trigger on version tags following semantic versioning (e.g., v0.1.2)
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/

release:
  stage: deploy
  image: jreleaser/jreleaser-slim:1.25.0
  needs:
    - build-plugin
  variables:
    # Disable shallow cloning so that JReleaser can diff between tags
    # to generate a changelog
    GIT_DEPTH: 0
  script:
    - export JRELEASER_PROJECT_VERSION=${CI_COMMIT_TAG#v}
    - jreleaser release
  rules:
    # Trigger only on version tags following semantic versioning (e.g., v0.1.2)
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
