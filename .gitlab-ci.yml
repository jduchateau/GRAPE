stages:
  - build
  - deploy

pages:
  stage: deploy
  needs: [ ]
  image: python:3-alpine
  before_script:
    - pip install poetry
    - poetry config virtualenvs.create false
    - poetry install
  script:
    - poetry run mkdocs build --verbose --strict
  artifacts:
    paths:
      - public
  rules:
    # This ensures that only pushes to the default branch
    # will trigger a pages deploy
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH

build-plugin:
  stage: build
  image: maven:3.9-eclipse-temurin-21
  variables:
    MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"
  cache:
    key: "grape-build-cache"
    paths:
      - build/mps-platform-cache
      - .m2/repository
  before_script:
    - |
      if [ ! -f ".m2/repository/io/carml/jar/carml-app-jena/1.5.0-SNAPSHOT/carml-app-jena-1.5.0-SNAPSHOT.jar" ]; then
        echo "carml dependencies not found in cache. Building from source..."

        echo "=== 1. Building carml (core) ==="
        git clone --branch rml-cg --depth 1 https://github.com/carml/carml.git /tmp/carml
        (cd /tmp/carml && mvn clean install -DskipTests)
        rm -rf /tmp/carml

        echo "=== 2. Building carml-jar ==="
        git clone --branch rml-cg --depth 1 https://github.com/carml/carml-jar.git /tmp/carml-jar
        (cd /tmp/carml-jar && mvn clean install -DskipTests)
        rm -rf /tmp/carml-jar
      else
        echo "carml dependencies found in cache, skipping build."
      fi
  script:
    - ./gradlew zip
  artifacts:
    paths:
      - build/artifacts/GrapePlugin/GrapePlugin.zip
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # Trigger on version tags following semantic versioning (e.g., v0.1.2)
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/

release:
  stage: deploy
  image: jreleaser/jreleaser-slim:1.25.0
  needs:
    - build-plugin
  variables:
    # Disable shallow cloning so that JReleaser can diff between tags
    # to generate a changelog
    GIT_DEPTH: 0
  script:
    - export JRELEASER_PROJECT_VERSION=${CI_COMMIT_TAG#v}
    - jreleaser release
  rules:
    # Trigger only on version tags following semantic versioning (e.g., v0.1.2)
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
